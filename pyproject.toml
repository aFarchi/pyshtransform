[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    {name = "Alban Farchi", email = "alban.farchi@ecmwf.int"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "xarray",
]
description = "Spherical harmonics transformation in Python"
name = "pyshtransform"
readme = "README.md"
requires-python = ">= 3.11"
version = "1.1.1"
keywords = [
    "spherical harmonics",
]

[project.optional-dependencies]
dev = [
    "dask",
    "h5netcdf",
    "ipykernel",
    "pytest",
    "rich",
    "ruff",
    "scipy-stubs",
]

[project.urls]
Issues = "https://github.com/aFarchi/pyshtransform/issues"
Source = "https://github.com/aFarchi/pyshtransform"

[tool.ruff]
preview = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.ruff.lint]
flake8-quotes.inline-quotes = "single"
pydocstyle.convention = "google"
pylint.allow-magic-value-types = ["int", "str"]
pylint.max-args = 15
pylint.max-locals = 20
pylint.max-statements = 75
select = ["ALL"]
ignore = [
    # no anotations
    "ANN",
    # no copyright on files
    "missing-copyright-notice",
    # no docstrings
    "D",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
pyshtransform = { path = ".", editable = true }

[tool.pixi.tasks]
lint = "ruff check"
format = "ruff format --config \"lint.ignore = ['COM812']\""
jl = "jupyter lab --no-browser"
test = "pytest -vs tests/"
gen-doc-api = "sphinx-apidoc -f -o docs/source/api/ src/"
clean-doc = "sphinx-build -M clean docs/source/ docs/build/"
gen-doc = "sphinx-build -M html docs/source/ docs/build/"

[tool.pixi.dependencies]
dask = ">=2026.8.0,<2027"
h5netcdf = ">=1.8.1,<2"
m2r2 = ">=2.1.0,<3"
numpy = ">=2.5.4,<3"
pytest = ">=9.1.1,<10"
rich = ">=15.0.0,<16"
ruff = ">=0.17.0,<0.18"
scipy = ">=1.18.1,<2"
scipy-stubs = ">=1.18.1.1,<2"
sphinx = ">=9.1.0,<10"
sphinx-rtd-theme = ">=3.1.0,<4"
xarray = ">=2026.9.0,<2027"
jupyterlab = ">=4.6.4,<5"

[tool.pytest.ini_options]
console_output_style = "progress"
testpaths = [
    "tests/",
]
norecursedirs = ["data"]
filterwarnings = [
    "error",
]
